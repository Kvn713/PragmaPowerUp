server:
  port: 8080
spring:
  application:
    name: "CrediYa_Ms_Autenticacion"
  devtools:
    add-properties: false
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
adapters:
  r2dbc:
    host: ${DB1_HOST}
    port: ${DB1_PORT}
    database: ${DB1_DATABASE}
    username: ${DB1_USER}
    password: ${DB1_PASSWORD}
spring-doc:
  swagger-ui:
    path: /swagger-ui.html
logging:
  level:
    root: INFO
    co.com.pragma.crediya: TRACE
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}
  issuer: ${JWT_ISSUER}